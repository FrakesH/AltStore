name: Build AltServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply AltSign authentication fixes
        run: |
          cd Dependencies/AltSign

          git fetch https://github.com/rileytestut/AltSign.git \
            3cd4a4a1cafd588cab371e49609d19e694108430 \
            67f90ce182059fbd2369efb8274f61b6f3253e35 \
            ec2968cf6a30be2a025be809641c64eade4570aa

          git cherry-pick 3cd4a4a1cafd588cab371e49609d19e694108430
          git cherry-pick 67f90ce182059fbd2369efb8274f61b6f3253e35
          git cherry-pick ec2968cf6a30be2a025be809641c64eade4570aa

          echo "AltSign revision after patches:"
          git log -4 --oneline

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install CocoaPods dependencies (if any)
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          fi

      - name: List available schemes (diagnostic)
        run: |
          xcodebuild -list -workspace AltStore.xcworkspace || xcodebuild -list -project AltStore.xcodeproj || true

      - name: Build AltServer (unsigned)
        run: |
          xcodebuild -workspace AltStore.xcworkspace \
            -scheme AltServer \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Zip the app
        run: |
          cd build/Build/Products/Release
          zip -r AltServer.zip AltServer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltServer
          path: build/Build/Products/Release/AltServer.zip
