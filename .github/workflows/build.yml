name: Build AltServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Use patched AltSign
        run: |
          rm -rf Dependencies/AltSign
          git clone https://github.com/Calvin-Zikakis/AltSign.git Dependencies/AltSign
          cd Dependencies/AltSign
          git checkout notarized
          git cherry-pick ec2968c

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install CocoaPods dependencies
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          fi

      - name: Build AltServer
        run: |
          xcodebuild \
            -workspace AltStore.xcworkspace \
            -scheme AltServer \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Zip AltServer
        run: |
          cd build/Build/Products/Release
          zip -r AltServer.zip AltServer.app

      - name: Upload AltServer
        uses: actions/upload-artifact@v4
        with:
          name: AltServer
          path: build/Build/Products/Release/AltServer.zip
